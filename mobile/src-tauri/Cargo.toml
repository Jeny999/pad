[package]
name = "pad-mobile"
version = "0.1.0"
description = "Pad"
edition = "2021"

[lib]
name = "pad_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Debug-APK с отладочными символами весит 130+ МБ; для игры они не нужны.
[profile.dev]
debug = false
strip = "debuginfo"
